<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carta visuale · Rubyfront</title>
<link rel="stylesheet" href="./shell.css">
<style>
  /* Chrome, tipografia e colori della pagina arrivano da shell.css.
     Qui restano solo il banco delle facce e la grafica della carta, che ha
     una sua identità visiva e non deve uniformarsi alla navigazione. */
  .table { display: flex; flex-wrap: wrap; justify-content: center; gap: 34px 26px; margin-top: 28px; }
  .face { display: flex; flex-direction: column; align-items: center; gap: 9px;
    width: min(520px, calc(100vw - 40px));
    flex: 0 0 min(520px, calc(100vw - 40px)); }
  .face-label { color: var(--ui-muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; }

  /* ====== base layout ====== */
  /* Reset locale: prima arrivava dal reset globale della pagina, che ora
     appartiene alla shell e non deve azzerare i margini della navigazione. */
  .card * { margin: 0; padding: 0; }
  .card {
    /* Il serif era ereditato dal body del renderer: ora la carta se lo porta
       da sé, così la shell resta sans e i temi possono comunque sovrascriverlo. */
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    /* Finestra dell'illustrazione: la proporzione del frame M15 di Magic, ~40%
       dell'altezza della carta. Il valore è in percentuale del box interno, al
       netto del padding, quindi 41.6% qui vale 40% di carta piena.
       È il parametro che comanda: il testo si adatta a ciò che resta. */
    --art-height: 41.6%;
    width: 100%;
    height: min(728px, calc(140vw - 56px));
    flex: none;
    /* Unica dimensione di tutti i testi della carta. Scesa da 16px a 13px:
       serve a liberare l'altezza dell'illustrazione, ma soprattutto è la
       misura con cui il testo entra in TUTTI i 28 temi — quelli a carattere
       monospazio (t03, t05, t23, t26) sfondavano la textbox già a 16px.
       Il nome resta l'unica eccezione (1.25em). */
    font-size: min(13px, 2.36vw);
    aspect-ratio: 5 / 7;
    display: flex; flex-direction: column; gap: .55em;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--frame);
    outline: 1px solid var(--frame-dim); outline-offset: 4px;
    border-radius: 4px; padding: 1.3em 1.1em .9em;
    clip-path: polygon(1.2em 0, calc(100% - 1.2em) 0, 100% 1.2em, 100% calc(100% - 1.2em), calc(100% - 1.2em) 100%, 1.2em 100%, 0 calc(100% - 1.2em), 0 1.2em);
    line-height: 1.48;
  }
  .titlebar {
    display: grid;
    grid-template-columns: 3.6em minmax(0, 1fr) 3.6em;
    align-items: center;
    gap: .65em;
    height: 2.6em;
    flex: 0 0 2.6em;
  }
  .titlebar > .hp {
    justify-self: end;
    white-space: nowrap;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    box-shadow: none;
    font-family: inherit;
    font-size: 1em;
    font-weight: 400;
    line-height: inherit;
    color: var(--ruby-light);
  }
  .titlebar > .hp small {
    color: inherit;
    font-size: 1em;
    letter-spacing: 0;
    text-transform: none;
  }
  .name { width: 100%; text-align: center; font-size: 1.25em; font-weight: 600;
    letter-spacing: .06em; font-variant: small-caps; line-height: 1.2;
    border-top: 1px solid var(--frame); border-bottom: 1px solid var(--frame); padding: .22em 0; }
  .cost { flex: none; width: 2.6em; height: 2.6em; background: var(--ruby);
    border: 1px solid var(--ruby-light); transform: rotate(45deg);
    display: flex; align-items: center; justify-content: center;
    position: relative; top: -.34em; }
  .cost i { transform: rotate(-45deg); font-style: normal;
    font-family: inherit;
    font-size: 1em; font-weight: 400; color: var(--cost-ink, #fdeef1); }
  .union-mark { flex: none; width: 3.1em; height: 2.2em; }
  .union-mark svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .art { height: var(--art-height); min-height: 0; flex: 0 0 var(--art-height); border: 1px solid var(--frame); background: var(--well);
    display: flex; align-items: center; justify-content: center;
    font-size: 1em; letter-spacing: .4em; text-transform: uppercase;
    color: color-mix(in srgb, var(--muted) 45%, transparent); }
  .keyword { text-align: center; font-size: 1em; color: var(--ruby-light);
    letter-spacing: .08em; font-variant: small-caps;
    display: flex; align-items: center; gap: .6em; justify-content: center; }
  .keyword::before, .keyword::after { content: "\25C6"; font-size: .55em; color: var(--ornament); }
  .keyword span { color: var(--muted); font-size: 1em; font-variant: normal; letter-spacing: 0; }
  .divider { display: flex; align-items: center; justify-content: center; gap: .7em;
    font-size: 1em; line-height: 1.48; color: var(--ornament); }
  .divider i { font-style: normal; font-size: .55em; }
  .divider::before, .divider::after { content: ""; width: 3.5em; height: 1px; background: var(--frame-dim); }
  .requirement { position: relative; border: 1px dashed var(--frame);
    margin-top: .4em; padding: .48em .5em .3em; text-align: center; }
  .requirement b { position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%);
    background: var(--panel); padding: 0 .6em;
    font-size: 1em; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; line-height: 1.15; white-space: nowrap; }
  .requirement span { font-size: 1em; color: var(--ink); }
  .textbox { flex: 1; border: 1px solid var(--frame-dim); background: var(--panel);
    padding: .8em .85em; display: flex; flex-direction: column; gap: .45em;
    font-size: 1em; overflow: hidden; }
  .card:not(.union) .textbox { padding-bottom: 1em; }
  .fx, .ability { display: grid; grid-template-columns: 4.4em 1fr;
    column-gap: .6em; align-items: baseline; }
  .fx .tag { grid-column: 1 / -1; display: flex; align-items: center; gap: .8em;
    font-size: 1em; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ruby-light); margin-bottom: .55em; }
  .fx .tag::after { content: ""; flex: 1; height: 1px; background: var(--frame-dim); }
  .fx .body { grid-column: 2; }
  .fx b, .ability b { color: var(--accent); font-weight: 600; }
  .hp-cost { font-size: 1em; white-space: nowrap; color: var(--ruby-light);
    background: var(--well); border: 1px solid var(--frame-dim);
    text-align: center; padding: .06em .3em; }
  .flavor { margin-top: auto; text-align: center; font-style: italic; font-size: 1em; color: var(--muted); }
  .flavor::before { content: "\25C6"; color: var(--ornament); font-size: .6em; font-style: normal; margin-right: .9em; vertical-align: .2em; }
  .flavor::after { content: "\25C6"; color: var(--ornament); font-size: .6em; font-style: normal; margin-left: .9em; vertical-align: .2em; }
  .bottombar { display: flex; justify-content: space-between; align-items: center; padding-top: .15em; }
  .matters { display: flex; gap: .5em; }
  .matter { display: flex; align-items: center; gap: .45em; border: 1px solid var(--frame);
    background: var(--panel); padding: .18em .5em; font-size: 1em; color: var(--ink); }
  .matter svg { width: 1.4em; height: 1.4em; display: block; }
  .matter b { color: #f3efe6; font-weight: 700; }
  .card.light-theme .matter b { color: #3a3430; }
  .hp { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 1em; font-weight: 700; color: var(--hp-green); }
  .hp small { color: var(--muted); font-weight: 400; font-size: 1em; }
