<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carta visuale · Rubyfront</title>
<link rel="stylesheet" href="./shell.css">
<link rel="stylesheet" href="./card.css">
<style>
  /* Chrome, tipografia e colori della pagina arrivano da shell.css.
     Qui restano solo il banco delle facce e la grafica della carta, che ha
     una sua identità visiva e non deve uniformarsi alla navigazione. */
  .table { display: flex; flex-wrap: wrap; justify-content: center; gap: 34px 26px; margin-top: 28px; }
  .face { display: flex; flex-direction: column; align-items: center; gap: 9px;
    width: min(520px, calc(100vw - 40px));
    flex: 0 0 min(520px, calc(100vw - 40px)); }
  .face-label { color: var(--ui-muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; }

</style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./card-theme-page.js"></script>
</body>
</html>
