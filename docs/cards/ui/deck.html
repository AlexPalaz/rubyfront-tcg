<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mazzo · Rubyfront</title>
<link rel="stylesheet" href="./shell.css">
<link rel="stylesheet" href="./card.css">
<style>
  /* La pagina del mazzo mostra le carte vere, in miniatura: ogni tessera è la
     carta a grandezza piena (520×728) scalata via transform, così il renderer
     e gli stili restano identici a quelli della carta singola. */
  .deck-grid { display: grid; grid-template-columns: repeat(auto-fill, 302px);
    justify-content: center; gap: 30px 22px; margin-top: 28px; }
  .deck-tile { position: relative; width: 302px; height: 424px; }
  .deck-tile > a { display: block; width: 100%; height: 100%; text-decoration: none; }
  .deck-holder { width: 520px; height: 728px; transform: scale(0.581);
    transform-origin: top left; pointer-events: none; }
  .deck-holder .face-label { display: none; }
  .deck-count { position: absolute; top: -9px; right: -7px; z-index: 2;
    min-width: 30px; text-align: center; padding: 2px 8px;
    background: var(--ui-ink); color: var(--ui-bg);
    border-radius: 999px; font-size: .8rem; font-weight: 750; }
  .deck-tile:hover { filter: brightness(1.08); }

</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./deck-page.js"></script>
</body>
</html>
