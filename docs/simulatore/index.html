<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulatore · Rubyfront</title>
  <script type="module" crossorigin src="./assets/index-q-RgDL44.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BIJyAEHF.css">
</head>
<body>
<!-- L'header è scarno di proposito: i gesti di partita stanno sull'HUD, le
     impostazioni dietro l'ingranaggio. Qui restano il marchio, lo stato della
     rete, Nuova partita (da sola: azzera tutto) e l'ingranaggio. -->
<header class="toolbar">
  <span class="brand">
    <b class="brand-main">Rubyfront</b>
    <span class="brand-gem" aria-hidden="true"></span>
    <span class="brand-sub">Simulator</span>
  </span>
  <span class="spacer"></span>
  <span id="engine-dot" class="dot dot-engine" hidden title="Engine spento"></span>
  <span id="net-dot" class="dot" title="Non collegato"></span>
  <button type="button" id="do-new" class="danger">Nuova partita</button>
  <button type="button" id="settings-toggle" class="gear-btn" title="Impostazioni" aria-label="Impostazioni">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M19.4 13c.04-.32.06-.65.06-1s-.02-.68-.07-1l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.73-1l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.63.26-1.21.6-1.74 1l-2.39-.96a.5.5 0 0 0-.6.22L2.68 8.78a.5.5 0 0 0 .12.64L4.83 11c-.05.32-.08.66-.08 1s.03.68.08 1l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.6.22l2.4-.96c.52.4 1.1.74 1.73 1l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54a7.3 7.3 0 0 0 1.73-1l2.4.96c.23.09.48 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64L19.4 13zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
  </button>
</header>

<!-- Il pannello delle impostazioni: si apre dall'ingranaggio, si chiude con
     un click fuori o con Esc. Tutto ciò che NON è un gesto di partita. -->
<div class="settings" id="settings" hidden>
  <div class="set-row">
    <span class="set-label">Mazzo</span>
    <span class="set-controls">
      <select id="deck-pick" title="Mazzo da caricare al tuo posto"></select>
      <button type="button" id="deck-load">Carica</button>
    </span>
  </div>
  <div class="set-row">
    <span class="set-label">Posto</span>
    <select id="seat-pick">
      <option value="a">A</option>
      <option value="b">B</option>
    </select>
  </div>
  <div class="set-row">
    <span class="set-label">Stanza</span>
    <span class="set-controls">
      <input id="room-name" placeholder="nome stanza" autocomplete="off">
      <button type="button" id="do-join">Entra</button>
    </span>
  </div>
  <div class="set-row">
    <span class="set-label">Invito</span>
    <span class="set-controls">
      <button type="button" id="room-create">Crea stanza</button>
      <button type="button" id="room-invite">Copia link</button>
    </span>
  </div>
  <div class="set-row">
    <span class="set-label">Relay</span>
    <input id="relay-url" placeholder="ws://localhost:8787" autocomplete="off">
  </div>
  <div class="set-row">
    <span class="set-label">Engine</span>
    <span class="set-controls">
      <label class="set-check" title="L'arbitro esterno (engine/): giudica le azioni prima che si applichino; assente, il tavolo resta libero">
        <input type="checkbox" id="engine-toggle">
        Acceso
      </label>
      <input id="engine-url" placeholder="ws://localhost:8788" autocomplete="off">
    </span>
  </div>
  <div class="set-row">
    <span class="set-label">Rete</span>
    <button type="button" id="do-push" class="ghost" title="Rimanda il tuo tavolo all'avversario, se le due lavagne si sono disallineate">Sincronizza la lavagna</button>
  </div>
  <div class="set-row">
    <span class="set-label">Microfono</span>
    <select id="mic-pick" title="Microfono per la chat vocale">
      <option value="">Predefinito</option>
    </select>
  </div>
  <div class="set-row">
    <span class="set-label">Vista</span>
    <label class="set-check">
      <input type="checkbox" id="compact-toggle">
      Compatta: sul campo solo costo, nome, potenza e illustrazione
    </label>
  </div>
  <div class="set-row">
    <span class="set-label">Tema</span>
    <select id="theme-pick" title="Tema del tavolo">
      <option value="notte">Notte</option>
      <option value="rubino">Rubino</option>
      <option value="smeraldo">Smeraldo</option>
      <option value="abisso">Abisso</option>
      <option value="acciaio">Acciaio</option>
      <option value="solarizzato">Solarizzato</option>
    </select>
  </div>
  <div class="set-row">
    <span class="set-label">Lingua</span>
    <select id="lang-pick" title="Lingua delle carte">
      <option value="it">IT</option>
      <option value="en">EN</option>
    </select>
  </div>
</div>

<!-- Onboarding: al primo arrivo (nessuna stanza) accompagna dentro in due
     passi — stanza, poi nome e mazzo. Chi ha già una stanza salvata o un
     link d'invito non lo vede mai. -->
<div class="onboard" id="onboard" hidden>
  <div class="onboard-card">
    <div class="onboard-brand">Rubyfront <span aria-hidden="true">◆</span> Simulator</div>

    <div id="ob-step-room">
      <p class="onboard-ask">Benvenuto al tavolo. Per giocare con qualcuno serve una stanza:</p>
      <button type="button" id="ob-create" class="onboard-primary">Crea una stanza</button>
      <div class="onboard-or">oppure entra in una stanza che conosci</div>
      <div class="onboard-row">
        <input id="ob-room" placeholder="nome stanza" autocomplete="off">
        <button type="button" id="ob-join">Entra</button>
      </div>
      <button type="button" id="ob-local" class="onboard-skip">Gioca in locale, senza stanza</button>
    </div>

    <div id="ob-step-profile" hidden>
      <p class="onboard-ask" id="ob-room-note" hidden></p>
      <label class="onboard-label" for="ob-name">Il tuo nome al tavolo</label>
      <input id="ob-name" placeholder="es. Ajmal" autocomplete="off" maxlength="24">
      <label class="onboard-label" for="ob-deck">Il mazzo con cui giochi</label>
      <select id="ob-deck"></select>
      <!-- Solo in partita locale: si guidano entrambi i posti, serve anche
           il mazzo dell'altra metà del tavolo. -->
      <label class="onboard-label" for="ob-deck-b" id="ob-deck-b-label" hidden>Il mazzo dell'avversario</label>
      <select id="ob-deck-b" hidden></select>
      <button type="button" id="ob-go" class="onboard-primary">Al tavolo</button>
    </div>
  </div>
</div>

<main class="layout">
  <div class="table" id="table">
    <!-- L'HUD non è una colonna: fluttua sopra il tavolo, sul bordo destro. -->
    <div class="hud" id="hud"></div>
  </div>
  <aside class="side" id="side">
    <button type="button" class="side-close" id="side-close" title="Chiudi la chat e allarga il tavolo">×</button>
    <div class="chat" id="chat"></div>
  </aside>
</main>

<div class="boot" id="boot">Carico le carte…</div>

</body>
</html>
