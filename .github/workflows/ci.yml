# I test a ogni push e a ogni PR: l'engine (Ruby, i quattro file di test),
# il core, il simulatore e il gioco (tsc, vitest) e la build del sito.
name: CI
on:
  push:
  pull_request:
jobs:
  engine:
    name: Engine (Ruby)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: for t in engine/test/*_test.rb; do ruby -Iengine/lib "$t"; done
  client:
    name: Core, simulatore e gioco (tsc, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # Un workspace solo (core, simulatore, gioco): un lockfile alla radice.
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: core
      - run: npx vitest run
        working-directory: core
      - run: npx tsc --noEmit
        working-directory: simulator
      - run: npx vitest run
        working-directory: simulator
      - run: npx tsc --noEmit
        working-directory: game
      - run: npx vitest run
        working-directory: game
      - run: node scripts/build-site.mjs
