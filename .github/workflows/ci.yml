# I test a ogni push e a ogni PR: l'engine (Ruby, ogni file di test in
# engine/test — il ciclo fallisce se uno qualunque fallisce, dal 2026-10-21),
# il core e il gioco (tsc, vitest), i copioni del proxy (node --test) e la
# build del sito.
name: CI
on:
  push:
  pull_request:
jobs:
  engine:
    name: Engine (Ruby)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: |
          fail=0
          for t in engine/test/*_test.rb; do
            echo "== $t"
            ruby -Iengine/lib "$t" || fail=1
          done
          exit $fail
  client:
    name: Core e gioco (tsc, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # Un workspace solo (core, gioco): un lockfile alla radice.
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: core
      - run: npx vitest run
        working-directory: core
      - run: npx tsc --noEmit
        working-directory: game
      - run: npx vitest run
        working-directory: game
      - run: node --test scripts/test/
      - run: node scripts/build-site.mjs
