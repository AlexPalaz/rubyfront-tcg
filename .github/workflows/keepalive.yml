# Render free dorme dopo un quarto d'ora senza traffico, e la prima
# connessione aspetta trenta secondi. Questo tocco era il rimedio, ma
# GitHub fa girare gli schedule ogni due-quattro ore, non ogni dieci
# minuti: il rimedio vero è il server che si tocca da solo
# (scripts/server.mjs, RENDER_EXTERNAL_URL). Questo resta come seconda
# mano, e come sveglia dopo un deploy.
name: Keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 https://rubyfront.onrender.com/ || echo "non risponde (dorme o non c'è ancora)"
