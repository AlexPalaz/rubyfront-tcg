# Il tavolo online su Render, piano free: UN servizio solo (Docker, vedi
# Dockerfile) col tavolo Ruby dietro il proxy Node. Dashboard → Blueprint
# su questo repo; a ogni push su main Render ricostruisce (auto-deploy), o
# si fa Manual sync.
#
# L'URL pubblico esce come https://rubyfront.onrender.com:
#   wss://rubyfront.onrender.com/engine  il tavolo (DEFAULT_ENGINE, engine.ts)
# Se Render assegna un nome diverso, si aggiorna quel default (o la
# variabile VITE_ENGINE_URL al build della pagina).
#
# Il piano free dorme dopo un quarto d'ora senza traffico: il server si
# tocca da solo ogni dieci minuti (scripts/server.mjs, RENDER_EXTERNAL_URL);
# il workflow .github/workflows/keepalive.yml è la seconda mano, ma GitHub
# lo fa girare ogni due-quattro ore.
services:
  - type: web
    name: rubyfront
    runtime: docker
    plan: free
    # Francoforte: chi gioca è in Italia, e un WebSocket sente la distanza.
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
