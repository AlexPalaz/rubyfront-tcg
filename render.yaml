# Il relay del simulatore su Render: dashboard → New + → Blueprint, si punta
# questo repo e questo file fa il resto. Nessuna build: il relay è trenta
# righe di Node senza dipendenze (scripts/relay.mjs), e legge la porta da
# PORT come Render si aspetta.
#
# Piano free: il servizio dorme dopo l'inattività e la prima connessione lo
# sveglia (~30 secondi). L'URL pubblico esce come
# https://rubyfront-relay.onrender.com → nel simulatore diventa
# wss://rubyfront-relay.onrender.com (è il DEFAULT_RELAY di produzione in
# simulatore/src/net.ts: se Render assegna un nome diverso, va aggiornato lì).
#
# L'engine (l'arbitro, engine/bin/server) è un secondo servizio dello
# stesso Blueprint: Ruby senza gemme (il Gemfile alla radice è vuoto, serve
# solo al runtime di Render), legge PORT e risponde 200 a una GET semplice
# (l'health check). L'URL pubblico esce come
# https://rubyfront-engine.onrender.com → wss://rubyfront-engine.onrender.com,
# il DEFAULT_ENGINE di produzione in simulatore/src/engine.ts. Su GitHub
# Pages, che serve solo file statici, l'engine non può girare: senza questo
# servizio la pagina pubblica gioca senza arbitro.
services:
  - type: web
    name: rubyfront-relay
    runtime: node
    plan: free
    buildCommand: "echo relay senza build"
    startCommand: node scripts/relay.mjs
    healthCheckPath: /
  - type: web
    name: rubyfront-engine
    runtime: ruby
    plan: free
    buildCommand: "echo engine senza build"
    startCommand: ruby engine/bin/server
    healthCheckPath: /
