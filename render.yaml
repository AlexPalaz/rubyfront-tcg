# Il tavolo online su Render, piano free: UN servizio solo (Docker, vedi
# Dockerfile) che tiene dentro relay ed engine — due servizi sempre svegli
# supererebbero le 750 ore al mese del piano free. Dashboard → Blueprint su
# questo repo; a ogni push su main Render ricostruisce (auto-deploy), o si
# fa Manual sync.
#
# L'URL pubblico esce come https://rubyfront.onrender.com:
#   wss://rubyfront.onrender.com/relay   il relay (DEFAULT_RELAY, net.ts)
#   wss://rubyfront.onrender.com/engine  l'engine (DEFAULT_ENGINE, engine.ts)
# Se Render assegna un nome diverso, si aggiornano quei due default (o le
# variabili VITE_RELAY_URL / VITE_ENGINE_URL al build della pagina).
#
# Il piano free dorme dopo un quarto d'ora senza traffico: il server si
# tocca da solo ogni dieci minuti (scripts/server.mjs, RENDER_EXTERNAL_URL);
# il workflow .github/workflows/keepalive.yml è la seconda mano, ma GitHub
# lo fa girare ogni due-quattro ore.
services:
  - type: web
    name: rubyfront
    runtime: docker
    plan: free
    # Francoforte: chi gioca è in Italia, e un WebSocket sente la distanza.
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
